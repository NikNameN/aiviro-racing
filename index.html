  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2f5a2a;

  canvas { position: absolute; top: 0; display: block; touch-action: none; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
          padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .btn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); width: 44px; height: 44px;

         padding: 0; margin: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;
         touch-action: none; -webkit-tap-highlight-color: transparent; outline: none; z-index: 2; }
  .btn:active { background: rgba(60,40,90,.8); }
  .btn svg { width: 24px; height: 24px; fill: #fff; pointer-events: none; }

  <canvas id="game"></canvas>
  <button id="muteBtn" class="btn" aria-label="Звук"></button>

<script>
"use strict";
// ===== Aiviro Racing — Карайкоз Н. В. (HTML5 Canvas, один файл, работает офлайн) =====
// Вид сверху, бесконечное шоссе. Мир в «игровых пикселях»: ширина не меньше 360, высота не меньше 640.
// Физика с фиксированным шагом 1/120 с — на 60 Гц и 120 Гц (ProMotion) игра одинаковая.

const BASE_H = 640, MIN_W = 360, MAX_W = 620;
const LANES = 4, LANE_W = 58, ROAD_W = LANES * LANE_W;   // дорога: 4 полосы
const PX_PER_M = 7;                                      // масштаб: 7 игровых пикселей = 1 м
const KMH = PX_PER_M / 3.6;                              // км/ч -> игровых пикселей в секунду
const V_START = 120, V_MAX = 500;                        // скорость игрока, км/ч: старт и потолок
// Разгон не прекращается: в начале ~+10 км/ч за 5 с, дальше медленнее (≈180 за 30 с, ≈290 за 2 мин, ≈400 за 5 мин)
function accelAt(v) { return 2.1 * Math.exp(-(v - V_START) / 170) + 0.35 * Math.max(0, 1 - v / 480); }
const SPEED_STEP = 50;                                   // каждые 50 км/ч — надпись «СКОРОСТЬ +»
const V_TRAFFIC = 60;                                    // скорость попутного потока, км/ч
const NITRO_ADD = 90, NITRO_TIME = 3;                    // нитро: +90 км/ч на 3 с
const LIVES = 3, INVULN = 2.0;
let CAR_W = 28, CAR_L = 52;                              // размеры выбранной машины игрока
// ----- Гараж: 5 машин на выбор (рисуются процедурно, вид сверху) -----
// acc — множитель разгона, steer — множитель руля, inv — неуязвимость после аварии, с
const CARS = [
  { id: "octavia", name: "Шкода Октавия A7", sub: "рестайлинг · лифтбек", colorName: "серебристая", lat: "Škoda Octavia A7 FL",
    color: "#c9ced5", dark: "#7a828c", roof: "#a9b0b9", w: 28, l: 54, rad: 8, kind: "liftback",
    acc: 1.03, steer: 1.00, inv: 2.0, trait: "Сбалансированная" },
  { id: "largus", name: "Лада Ларгус", sub: "универсал", colorName: "белая", lat: "Lada Largus",
    color: "#f4f5f6", dark: "#aab0b8", roof: "#dde1e5", w: 29, l: 55, rad: 5, kind: "wagon",
    acc: 0.95, steer: 0.98, inv: 2.6, trait: "Неубиваемая: дольше неуязвимость" },
  { id: "gs3", name: "GAC GS3", sub: "кроссовер", colorName: "голубая", lat: "GAC GS3",
    color: "#6cc4ef", dark: "#2c82b4", roof: "#1c1f25", w: 29, l: 51, rad: 8, kind: "gs3",
    acc: 1.00, steer: 1.07, inv: 2.0, trait: "Компактная: самый лёгкий руль" },
  { id: "focus", name: "Форд Фокус 2", sub: "рестайлинг · хэтчбек", colorName: "тёмно-синяя", lat: "Ford Focus II FL",
    color: "#24447f", dark: "#0f1f42", roof: "#18315e", w: 28, l: 50, rad: 9, kind: "focus",
    acc: 1.05, steer: 1.04, inv: 2.0, trait: "Резвая и вёрткая" },
  { id: "xc60", name: "Вольво XC60", sub: "кроссовер", colorName: "белая", lat: "Volvo XC60",
    color: "#f2f3f5", dark: "#a6acb4", roof: "#e3e6ea", w: 31, l: 56, rad: 7, kind: "xc60",
    acc: 1.08, steer: 0.94, inv: 2.0, trait: "Самый мощный, но крупный" },
  { id: "e39", name: "БМВ 5 (E39), 1998", sub: "седан", colorName: "серебристая", lat: "BMW 5 Series E39 · Titansilber",
    color: "#b3bfcd", dark: "#5f6c7d", roof: "#97a4b4", w: 29, l: 57, rad: 7, kind: "e39",
    acc: 1.06, steer: 0.99, inv: 2.0, trait: "Классика: длинный капот, задний привод" },
];
let carIdx = Math.max(0, Math.min(CARS.length - 1, parseInt(lsGetEarly("racingCar", "0"), 10) || 0));
function curCar() { return CARS[carIdx]; }
function applyCar() { CAR_W = curCar().w; CAR_L = curCar().l; }
function changeCar(d) { carIdx = (carIdx + d + CARS.length) % CARS.length; lsSet("racingCar", carIdx); applyCar(); selAnim = d; sound("pass"); }
function lsGetEarly(key, def) { try { const v = localStorage.getItem(key); return v === null ? def : v; } catch (e) { return def; } }
let selAnim = 0, ui = {}, swipeX = null;
// ----- Кошелёк и тюнинг (сохраняются в localStorage) -----
const UPG = [
  { id: "eng",   name: "Двигатель",  desc: l => "разгон +" + 3 * l + "%" },
  { id: "steer", name: "Управление", desc: l => "руль +" + 4 * l + "%" },
  { id: "arm",   name: "Прочность",  desc: l => "неуязв. +" + (0.3 * l).toFixed(1).replace(".", ",") + " с · жизней " + (LIVES + (l >= 3 ? 1 : 0) + (l >= 5 ? 1 : 0)) },
  { id: "nitro", name: "Нитро",      desc: l => "+" + (NITRO_ADD + 8 * l) + " км/ч · " + (NITRO_TIME * (1 + 0.12 * l)).toFixed(1).replace(".", ",") + " с" },
  { id: "mag",   name: "Магнит",     desc: l => l ? "сбор монет +" + 7 * l + " пикс" : "без магнита" },
];
const UPG_COST = [50, 120, 250, 450, 750], UPG_MAX = 5;
let wallet = Math.max(0, parseInt(lsGetEarly("racingWallet", "0"), 10) || 0);
let upg = {}; try { upg = JSON.parse(lsGetEarly("racingUpg", "{}")) || {}; } catch (e) { upg = {}; }
function lvl(id, m) { const u = upg[(m || curCar()).id]; return u && u[id] ? clamp(u[id] | 0, 0, UPG_MAX) : 0; }
function saveWallet() { lsSet("racingWallet", wallet); }
function buyUpg(id) {
  const l = lvl(id); if (l >= UPG_MAX) return "max";
  const cost = UPG_COST[l]; if (wallet < cost) return "nomoney";
  wallet -= cost; const c = curCar().id; upg[c] = upg[c] || {}; upg[c][id] = l + 1;
  saveWallet(); lsSet("racingUpg", JSON.stringify(upg)); return "ok";
}
function accMul() { return curCar().acc * (1 + 0.03 * lvl("eng")); }
function steerMul() { return curCar().steer * (1 + 0.04 * lvl("steer")); }
function invTime() { return curCar().inv + 0.3 * lvl("arm"); }
function maxLives() { const a = lvl("arm"); return LIVES + (a >= 3 ? 1 : 0) + (a >= 5 ? 1 : 0); }
function nitroAdd() { return NITRO_ADD + 8 * lvl("nitro"); }
function nitroTime() { return NITRO_TIME * (1 + 0.12 * lvl("nitro")); }
function magR() { return 7 * lvl("mag"); }
function coinMult() { return speed >= 350 ? 3 : speed >= 230 ? 2 : 1; }   // на скорости монеты ценнее
let runCoins = 0, shopFrom = "start", shopFx = null;
function openShop(from) { shopFrom = from; state = "shop"; shopFx = null; updateButtons(); }
function closeShop() { state = shopFrom; if (state === "over") overLock = 0; updateButtons(); }
function doBuy(i) {
  const u = UPG[i], l0 = lvl(u.id), r = buyUpg(u.id);
  shopFx = { i: i, t: 0.9, ok: r === "ok",
             msg: r === "ok" ? "Уровень " + (l0 + 1) + "!" : r === "max" ? "Уже максимум" : "Не хватает " + (UPG_COST[l0] - wallet) + " монет" };
  sound(r === "ok" ? "pickup" : "deny"); return r;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, f) { return a + (b - a) * f; }
const STEP = 1 / 120, MAX_FRAME = 0.1, OVER_LOCK = 0.8;

function readSafe() {
  const cs = getComputedStyle(document.getElementById("safe"));
  return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0,
           b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function resize() {
  const cw = wrap.clientWidth || window.innerWidth, ch = wrap.clientHeight || window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  k = ch / BASE_H;
  if (cw / k < MIN_W) k = cw / MIN_W;
  H = ch / k; W = Math.min(cw / k, MAX_W);
  CX = W / 2; ROAD_L = CX - ROAD_W / 2; ROAD_R = CX + ROAD_W / 2;
  const cssW = W * k, cssH = H * k, off = (cw - cssW) / 2;
  canvas.style.width = cssW + "px"; canvas.style.height = cssH + "px"; canvas.style.left = off + "px";
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  const s = readSafe();
  safe = { t: s.t / k, r: s.r / k, b: s.b / k, l: s.l / k };
  PLAYER_Y = H - safe.b - 150;
  muteBtn.style.left = (off + s.l + 10) + "px"; pauseBtn.style.right = (off + s.r + 10) + "px";
  nitroBtn.style.right = (off + s.r + 12) + "px"; nitroBtn.style.bottom = (s.b + 14) + "px";
  if (scenery.length === 0 || Math.abs(W - lastSceneryW) > 1) { initScenery(); lastSceneryW = W; }
  if (state === "playing") pause();
  draw();
}

function newScenery(side, y) {
  const r = Math.random(); let type;
  if (r < 0.42) type = "tree"; else if (r < 0.6) type = "bush"; else if (r < 0.8) type = "factory";
  else if (r < 0.9) type = "board"; else type = "pallets";
  return { side: side, y: y, type: type, off: rand(6, Math.max(26, (W - ROAD_W) / 2 - 60)), size: rand(0.8, 1.2), seed: Math.random() };
}
function initScenery() {
  scenery = [];
  for (const side of [-1, 1]) { let y = H + 60, guard = 0; while (y > -200 && guard++ < 500) { scenery.push(newScenery(side, y)); y -= rand(70, 140) * sceneryGap(); } }
}
function sceneryGap() { return Math.max(0.45, Math.min(1, 70 / ((W - ROAD_W) / 2))); }
function sceneryTop(side) { let m = Infinity; for (const s of scenery) if (s.side === side && s.y < m) m = s.y; return m; }

// ----- Трафик: строки машин, в каждой строке минимум одна полоса свободна -----
const COLORS = ["#e53935", "#1e88e5", "#fdd835", "#43a047", "#fb8c00", "#eceff1", "#455a64", "#00acc1", "#6d4c41"];
function newCar(lane, y) {
  const r = Math.random(); let type, w, l;
  if (r < 0.55) { type = "car"; w = 27; l = 48; }
  else if (r < 0.75) { type = "van"; w = 29; l = 58; }
  else { type = "truck"; w = 32; l = 92; }
  return { lane: lane, x: laneX(lane) + rand(-9, 9) * (lane === 0 || lane === LANES - 1 ? 0.6 : 1),   // смещение в полосе: «между рядами» не отсидеться
            y: y - l, w: w, l: l, type: type, color: pick(COLORS),
           cab: pick(["#c62828", "#1565c0", "#f9a825", "#2e7d32", "#ef6c00", "#5e35b1"]),
           v: V_TRAFFIC, passed: false, crashed: false, vx: 0, rot: 0, vr: 0,
           row: rowCount, sig: 0, sigTo: lane, sigDir: 0, moveT: 0.8, mv: null };   // sig/mv — перестроение
}
// ----- Плотность потока -----
// Базовый уровень растёт плавно со временем заезда: 1 − e^(−t/100)
//   (≈0,26 на 30 с, 0,45 на 1 мин, 0,70 на 2 мин, 0,83 на 3 мин, 0,95 на 5 мин).
// Поверх — волны: «поток» 16–26 с → «плотный поток» 6–9 с (+0,22) → «передышка» 3,5–5 с (×0,35).
// После аварии сразу передышка. Уровень сглажен (τ = 1,5 с), поэтому меняется без рывков.
function densRamp(tm) { return 1 - Math.exp(-tm / 100); }
function waveNext() {
  if (wave.phase === "flow") { wave.phase = "rush"; wave.t = rand(6, 9); popup("ПЛОТНЫЙ ПОТОК!", CX, PLAYER_Y - 130, "#ffb74d"); }
  else if (wave.phase === "rush") { wave.phase = "calm"; wave.t = rand(3.5, 5); popup("ПЕРЕДЫШКА", CX, PLAYER_Y - 130, "#a5d6a7"); }
  else { wave.phase = "flow"; wave.t = rand(16, 26); }
}
function updateDensity(dt) {
  playTime += dt;
  wave.t -= dt; if (wave.t <= 0) waveNext();
  const base = densRamp(playTime);
  let tgt = base * (1 + 0.06 * Math.sin(playTime * 0.8));            // лёгкое «дыхание» потока
  if (wave.phase === "rush") tgt = base + 0.22 * Math.min(1, 0.35 + base);
  else if (wave.phase === "calm") tgt = base * 0.35;
  densTarget = clamp(tgt, 0, 1);
  dens += (densTarget - dens) * Math.min(1, dt / 1.5);
}
// Промежуток между рядами — во времени, поэтому в пикселях он растёт со скоростью:
// 1,8 с (редко) → 0,72 с (плотно), на скорости > 250 км/ч до +0,12 с запаса на реакцию.
function rowGapSec() { const hs = clamp((speed - 250) / 250, 0, 1); return lerp(1.8, 0.72, dens) + 0.12 * hs; }
function spawnRow() {
  rowCount++;
  const d = dens;
  const hs = clamp((speed - 300) / 200, 0, 1);              // на очень высокой скорости реже 3 машины в ряд
  const p1 = lerp(0.78, 0.12, d), p3 = lerp(0, 0.5, d) * (1 - 0.4 * hs);
  const rr = Math.random();
  let nb = rr < p1 ? 1 : (rr < 1 - p3 ? 2 : 3);               // максимум 3 из 4 полос — одна всегда свободна
  if (rowCount <= 2) nb = 1;
  let blocked, free, tries = 0;
  do {                                                     // свободная полоса не дальше 2 полос от прошлой
    const order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
    blocked = order.slice(0, nb); free = order.slice(nb);
    tries++;
  } while (tries < 30 && !free.some(f => lastFree.some(p => Math.abs(p - f) <= 2)));
  lastFree = free;
  let rowLen = 0;
  for (const ln of blocked) { const c = newCar(ln, -40 - rand(0, 30)); traffic.push(c); rowLen = Math.max(rowLen, c.l); }
  // Бонусы — в свободной полосе между строками
  const fl = pick(free);
  if (rowCount % 17 === 0) pickups.push({ kind: "nitro", x: laneX(fl), y: -40 - rowLen - 80, taken: false });
  else if (Math.random() < 0.45) {
    const n = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) pickups.push({ kind: "coin", x: laneX(fl), y: -40 - i * 34, taken: false });
  }
  return rowLen;
}
function rel() { return Math.max(0, speed - V_TRAFFIC) * KMH; }   // скорость потока относительно игрока, пикс/с

// ----- Перестроения потока с поворотниками -----
// Машина сначала мигает поворотником (0,9–1,3 с, 2,5 Гц), потом плавно уходит в соседнюю полосу (0,6–0,9 с, фура ×1,35).
// Правила честности: машина в перестроении занимает обе полосы; рядом (±длина машины + 34 пикс по вертикали)
// после перестроения должно остаться ≥ 1 свободной полосы; целевая полоса рядом должна быть пустой;
// в полосу игрока — только если манёвр закончится заранее (не подрезаем).
let laneChangeT = 4, laneChanges = 0;
const LC_GAP = 34;
function occLanes(o, s) { s.add(o.lane); if (o.mv) s.add(o.mv.to); if (o.sig > 0) s.add(o.sigTo); }
function windowLanes(c, G) {
  const s = new Set();
  for (const o of traffic) { if (o.crashed || o.y > c.y + c.l + G || o.y + o.l < c.y - G) continue; occLanes(o, s); }
  return s;
}
function rowFree(row) {
  const s = new Set(); for (const o of traffic) if (!o.crashed && o.row === row) occLanes(o, s);
  const f = [0, 1, 2, 3].filter(l => !s.has(l)); return f.length ? f : lastFree;
}
function tryLaneChange() {
  const r = rel(); if (r <= 1) return false;
  const hs = clamp((speed - 120) / 180, 0, 1), frontY = PLAYER_Y - CAR_L / 2;   // к 300 км/ч сигнал 0,9 с
  const cands = [];
  for (const c of traffic) {
    if (c.crashed || c.passed || c.sig > 0 || c.mv || c.y + c.l < 4) continue;      // задние фонари уже видны
    const sig = lerp(1.3, 0.9, hs) * rand(1, 1.08), moveT = lerp(0.9, 0.6, hs) * (c.type === "truck" ? 1.35 : 1);
    const tReach = (frontY - (c.y + c.l)) / r;                                    // через сколько секунд машина поравняется с игроком
    if (tReach < sig + 0.2) continue;                                             // поворотник успеют увидеть целиком
    const G = c.l + LC_GAP;
    for (const d of [-1, 1]) {
      const b = c.lane + d; if (b < 0 || b >= LANES) continue;
      const near = Math.abs(laneX(b) - player.x) < LANE_W * 0.95;
      if (near && tReach < sig + moveT + 0.5) continue;                            // не подрезать перед носом

  ctx.fillStyle = "rgba(15,10,28,0.55)"; ctx.fillRect(0, 0, W, H);
  textC("ПАУЗА", CX, H * 0.42, 40, "#fff", 900, "#3d1f66");
  textC(isTouch ? "Коснись, чтобы продолжить" : "P или ПРОБЕЛ — продолжить", CX, H * 0.42 + 44, 15, "#e1d5ff", 700);
}
function draw() {
  ctx.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 14, rand(-1, 1) * shake * 14);
  drawGround();
  for (const s of scenery) drawSceneryBase(s);
  for (const p of pickups) drawPickup(p);
  for (const c of traffic) drawTraffic(c);
  if (state !== "start" && state !== "shop") drawPlayer();
  drawParticles();
  for (const s of scenery) drawSceneryTop(s);
  if (nitroT > 0 && state === "playing") {                // линии скорости
    ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 1.5;
    for (let i = 0; i < 10; i++) { const x = ((i * 97 + animT * 13) % W), y = (i * 173 + animT * 1400) % H; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 50); ctx.stroke(); }
  }
  for (const p of popups) { ctx.globalAlpha = Math.min(1, p.t * 2); textC(p.text, p.x, p.y, 16, p.c, 900, "rgba(0,0,0,0.6)"); ctx.globalAlpha = 1; }
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = "rgba(255,255,255," + Math.min(0.6, flash * 2.4) + ")"; ctx.fillRect(0, 0, W, H); }
  if (state === "playing" || state === "paused") drawHUD();
  if (state === "start") drawStart();
  else if (state === "over") drawOver();
  else if (state === "paused") drawPaused();
  else if (state === "shop") drawShop();
}

// ----- Игровой цикл: requestAnimationFrame + фиксированный шаг физики -----
let lastTime = performance.now(), acc = 0;
function tick(frameDt) {
  if (!(frameDt > 0)) frameDt = 0;
  if (frameDt > MAX_FRAME) frameDt = MAX_FRAME;
  if (state === "paused") { acc = 0; return; }
  acc += frameDt;
  let n = 0;
  while (acc >= STEP && n < 20) { update(STEP); acc -= STEP; n++; }
}
let engTimer = 0;
let loopErrors = 0;
function loop(now) {
  requestAnimationFrame(loop);                 // следующий кадр планируем сразу — ошибка не остановит игру
  try {
    tick((now - lastTime) / 1000); lastTime = now;
    if ((engTimer += 1) % 6 === 0) updateEngine();
    draw();
  } catch (e) {
    lastTime = now; acc = 0;
    if (loopErrors++ < 5) { try { console.warn("frame error:", e && e.message); } catch (e2) {} }
  }
}
applyCar();
resize();
updateButtons();
requestAnimationFrame(t => { lastTime = t; requestAnimationFrame(loop); });
</script>
